name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build web apps
        run: pnpm build

      # Operating rule 10. A committed .env would not be caught by any test above.
      - name: Assert no committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$'; then
            echo "::error::A .env file is tracked in git. Remove it and rotate the values."
            exit 1
          fi

      - name: Scan tracked files for secret-shaped strings
        run: ./scripts/scan-secrets.sh --self-test && ./scripts/scan-secrets.sh

      # Fails on any high or critical advisory in production dependencies. The one ignored advisory
      # (zod, GHSA-mrhx-c7xc-m3w5) needs a zod 3 to 4 major upgrade; see docs/security-headers-and-scans.md.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  database:
    runs-on: ubuntu-latest

    # Plain Postgres plus supabase/tests/_harness.sql, not `supabase start` — no Docker service
    # needed, and the same script developers run locally.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Verifies the migrations apply to a FRESH database, then runs the RLS and atomicity suites.
      - name: Migrations, seed and SQL tests
        run: ./scripts/db-test.sh

      # V-03 and V-05 under genuine concurrency. A sequential test passes against an
      # implementation with no row lock at all, so this one is not optional.
      - name: Concurrency tests
        run: ./scripts/db-concurrency-test.sh
